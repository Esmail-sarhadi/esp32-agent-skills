name: release

# PyInstaller cannot cross-compile: a Windows .exe has to be built on Windows and
# a Linux binary on Linux. This workflow runs build.py on both and attaches the
# results to the release, so a tag produces two artifacts that actually run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build the zipapp and the native executable
        run: python build.py

      - name: Run the test suite before shipping anything
        run: python -m unittest discover -s tests

      - name: Smoke test the artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/esp32-skills --list
          ./dist/esp32-skills pincheck --soc esp32 --assign "6=led" && exit 1 || true
          ./dist/esp32-skills airtime --sf 12 --payload 20 | grep -q "1.319"

      - name: Smoke test the artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/esp32-skills.exe --list
          ./dist/esp32-skills.exe airtime --sf 12 --payload 20 | Select-String "1.319"

      - name: Name the artifact for the platform
        id: name
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "file=dist/esp32-skills.exe" >> "$GITHUB_OUTPUT"
            echo "label=windows-x64" >> "$GITHUB_OUTPUT"
          else
            echo "file=dist/esp32-skills" >> "$GITHUB_OUTPUT"
            echo "label=linux-x64" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-skills-${{ steps.name.outputs.label }}
          path: |
            ${{ steps.name.outputs.file }}
            dist/esp32-skills.pyz
          if-no-files-found: error

  release:
    name: attach the artifacts to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what is being released
        run: find artifacts -type f -printf "%p %s bytes\n"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/esp32-skills-windows-x64/esp32-skills.exe
            artifacts/esp32-skills-linux-x64/esp32-skills
            artifacts/esp32-skills-windows-x64/esp32-skills.pyz
          fail_on_unmatched_files: false
