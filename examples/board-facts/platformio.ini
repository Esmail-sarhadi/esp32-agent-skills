; A sketch that asks the chip what it is, so the pin profile in
; data/esp32-pins.json can be checked against a real module instead of a
; datasheet. Flash it, open the serial monitor at 115200, read the output.
;
;   pio run -t upload --upload-port COM6
;
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
