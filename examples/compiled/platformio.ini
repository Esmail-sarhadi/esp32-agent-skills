; Every rule in the skills, as code the compiler has to accept.
;
; This project is not meant to run: it exists so that an API the skills tell you
; to call is proven to exist, with the right signature, on the current Arduino
; core. A skill that recommends a function which does not compile is worse than
; no skill at all.
;
;   pio run -d examples/compiled
;
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
